name: Update Leaderboard

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  push:
    branches:
      - main
    paths:
      - 'roster.txt'
      - 'fetch_stats.py'
      - '.github/workflows/update_leaderboard.yml'
  workflow_dispatch: # Manual run trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch Latest Stats & Generate Leaderboard JSON
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GCP_CREDENTIALS }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python fetch_stats.py

      - name: Commit and Push Updated Leaderboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          
          # Only commit and push if data actually changed
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update leaderboard data [skip ci]"
            git push origin main
          else
            echo "Leaderboard data is already up to date. No commit needed."
          fi
