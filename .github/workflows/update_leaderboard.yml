name: Update Leaderboard

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # Every 15 minutes

  push:
    branches:
      - main
    paths:
      - 'Cylab Username - Sheet1.csv'
      - '*.csv'
      - 'roster.txt'
      - 'fetch_stats.py'
      - 'requirements.txt'
      - '.github/workflows/update_leaderboard.yml'

  workflow_dispatch:

# Prevent simultaneous runs from racing to push changes
concurrency:
  group: update-leaderboard-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch Latest Stats & Generate Leaderboard JSON
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GCP_CREDENTIALS }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Fetch attempt $attempt of 3"

            if python fetch_stats.py; then
              echo "Fetch completed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Fetch failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "::error::All three fetch attempts failed."
          exit 1

      - name: Verify Leaderboard JSON
        run: python -m json.tool leaderboard.json > /dev/null

      - name: Commit and Push Updated Leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add leaderboard.json

          if ! git diff --staged --quiet; then
            git commit -m "Auto-update leaderboard data [skip ci]"

            pushed=0
            for attempt in 1 2 3 4 5; do
              echo "Push attempt $attempt of 5..."

              if [ "$attempt" -gt 1 ]; then
                echo "Syncing with latest remote changes before retry..."
                git fetch origin main
                git rebase -X ours origin/main || {
                  echo "Rebase failed, aborting..."
                  git rebase --abort || true
                }
              fi

              if git push origin HEAD:main; then
                echo "Leaderboard successfully committed and pushed to main."
                pushed=1
                break
              fi

              if [ "$attempt" -lt 5 ]; then
                wait_time=$((attempt * 5))
                echo "Push failed (transient remote error or rejected). Retrying in ${wait_time}s..."
                sleep $wait_time
              fi
            done

            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push updated leaderboard after 5 attempts."
              exit 1
            fi
          else
            echo "Leaderboard data is already up to date. No commit needed."
          fi
