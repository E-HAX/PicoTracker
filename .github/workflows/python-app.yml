name: Systum

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'scraping.py'
      - 'sheets.py'
      - 'requirements.txt'
      - '.github/workflows/python-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run script
      run: |
        python main.py
      env:
        GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GCP_CREDENTIALS }}
